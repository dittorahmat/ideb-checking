<h2>Input Permintaan IDeb - Individual</h2>

<!-- Tabs -->
<ul class="nav nav-tabs" id="searchTabs" role="tablist">
    <li class="nav-item" role="presentation">
        <button class="nav-link active" id="similar-tab" data-bs-toggle="tab" data-bs-target="#similar" type="button" role="tab" aria-controls="similar" aria-selected="true">Similar Match Search</button>
    </li>
    <li class="nav-item" role="presentation">
        <button class="nav-link" id="exact-tab" data-bs-toggle="tab" data-bs-target="#exact" type="button" role="tab" aria-controls="exact" aria-selected="false">Exact Match Search</button>
    </li>
</ul>

<!-- Tab Content -->
<div class="tab-content" id="searchTabsContent">
    <!-- Similar Match Search Tab -->
    <div class="tab-pane fade show active" id="similar" role="tabpanel" aria-labelledby="similar-tab">
        <form id="ideb-request-form-individual-similar">
            <div class="mb-3">
                <label for="nomor_referensi_pengguna_individual_similar" class="form-label">Nomor Referensi Pengguna</label>
                <input type="text" class="form-control" id="nomor_referensi_pengguna_individual_similar" required>
            </div>
            <div class="mb-3">
                <label for="tujuan_penggunaan_individual_similar" class="form-label">Tujuan Penggunaan</label>
                <select class="form-select" id="tujuan_penggunaan_individual_similar" required>
                    <option value="">Pilih Tujuan Penggunaan</option>
                    <option value="01">01 Penilaian Calon Debitur</option>
                    <option value="02">02 Penerapan one obligor concept</option>
                    <option value="03">03 Monitoring debitur existing</option>
                    <option value="04">04 Melayani permintaan debitur</option>
                    <option value="05">05 Dalam Rangka Pelaksanaan Audit</option>
                    <option value="06">06 Penanganan pengaduan debitur</option>
                    <option value="07">07 Penilaian karyawan/calon karyawan</option>
                    <option value="08">08 Penilaian calon vendor</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="jenis_identitas_individual_similar" class="form-label">Jenis Identitas</label>
                <select class="form-select" id="jenis_identitas_individual_similar" required>
                    <option value="1">KTP</option>
                    <option value="2">Paspor</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="nomor_identitas_individual_similar" class="form-label">Nomor Identitas</label>
                <input type="text" class="form-control" id="nomor_identitas_individual_similar" required>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="permintaan_fasilitas_outstanding_individual_similar">
                <label class="form-check-label" for="permintaan_fasilitas_outstanding_individual_similar">Permintaan Fasilitas Outstanding</label>
            </div>
            <div class="mb-3">
                <label class="form-label">Search Type</label>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="search_type_individual_similar" id="search_internal_individual_similar" value="internal" checked>
                    <label class="form-check-label" for="search_internal_individual_similar">
                        Internal Database
                    </label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="search_type_individual_similar" id="search_live_individual_similar" value="live">
                    <label class="form-check-label" for="search_live_individual_similar">
                        Live SLIK OJK
                    </label>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>
