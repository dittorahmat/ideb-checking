<script>
// Add event listeners for conditional fields in Similar Match Search
document.addEventListener('DOMContentLoaded', function() {
    // Get the similar match form
    const similarForm = document.getElementById('ideb-request-form-badan-usaha-similar');
    
    if (similarForm) {
        // Get the input fields
        const nomorIdentitas = document.getElementById('nomor_identitas_badan_usaha_similar');
        const tempatPendirian = document.getElementById('tempat_pendirian_similar');
        const tanggalPendirian = document.getElementById('tanggal_pendirian_similar');
        const namaBadanUsaha = document.getElementById('nama_badan_usaha_similar');
        
        // Add form submit validation
        similarForm.addEventListener('submit', function(e) {
            const hasNamaBadanUsaha = namaBadanUsaha.value.trim() !== '';
            
            // Nama Badan Usaha is mandatory
            if (!hasNamaBadanUsaha) {
                e.preventDefault();
                alert('Nama Badan Usaha wajib diisi');
                return;
            }
        });
    }
});
</script>
